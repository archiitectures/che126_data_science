name: Extract FSRI polyethylene HFM source tables
on:
  push:
    branches: [codex/fsri-extract]
    paths: [fsri-manifest.json, extract_fsri.py, .github/workflows/fsri-extract.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/fsri-extract
      - run: python extract_fsri.py
      - name: Save source table extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fsri_hfm_extract.json
          git commit -m "data: extract FSRI polyethylene HFM tables"
          git push origin HEAD:codex/fsri-extract
