name: Verify patent client and resolve lock
on:
  push:
    branches: [codex/patents-bootstrap]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/patents-bootstrap
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.12'
      - run: uv lock
      - run: uv sync --locked --extra patents --group dev
      - run: uv run --locked --extra patents --group dev pytest -q
      - run: uv run --locked --group dev ruff check src tests
      - run: uv run --locked --group dev ruff format --check src tests
      - run: uv build
      - name: Save resolved lock after checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || git commit -m "build: resolve patent client dependencies"
          git push origin HEAD:codex/patents-bootstrap
