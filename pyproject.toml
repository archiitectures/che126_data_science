version = "0.1.0"
description = "Temperature-dependent battery separator research for the ChE126 capstone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
patents = ["google-cloud-bigquery>=3.25,<4"]

[dependency-groups]
